# Bare mygrok-server, no TLS front (server side).
#
# Setup:
#   cp .env.example .env   # fill DOMAIN / MYGROK_TOKEN
#   docker compose up -d
#
# For tcp/udp-only setups or private networks. Clients dial
# your-vps.com:7000 directly; tunnels get public ports 20000-20099.
#
# The mygrok image must exist locally: build it once from the repo root
# (see ../README.md) or `docker load` a tarball from `make docker-save`.

name: mygrok-example-05

services:
  mygrok-server:
    image: mygrok:${MYGROK_TAG:-0.4.0}
    network_mode: host
    command: ["mygrok-server", "-domain", "${DOMAIN}", "-control", "${MYGROK_CONTROL_ADDR:-:7000}", "-http", "${MYGROK_HTTP_ADDR:-127.0.0.1:8080}", "-port-base", "${MYGROK_PORT_BASE:-20000}", "-port-count", "${MYGROK_PORT_COUNT:-100}", "-log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    # network_mode: host binds the control port and tunnel range directly on
    # the host (same as bare-binary mode). 8080 stays loopback: without a TLS
    # front, HTTP tunnels are off by default — point your own host nginx at
    # 127.0.0.1:8080 if you need them (see deploy/nginx/...example).
    restart: unless-stopped
