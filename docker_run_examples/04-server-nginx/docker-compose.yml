# Full mygrok server stack, self-contained: mygrok-server + nginx TLS front.
#
# Setup:
#   cp .env.example .env        # fill DOMAIN / MYGROK_TOKEN
#   mkdir -p certs              # drop fullchain.pem / privkey.pem (wildcard cert)
#   docker compose up -d
#
# The mygrok image is built by the `build:` block below (repo context: the
# repository root, two levels up). On an air-gapped host you can `docker load`
# a tarball from `make docker-save` and delete the `build:` block.

name: mygrok-example-04

services:
  mygrok-server:
    image: mygrok:${MYGROK_TAG:-0.3.0}
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${MYGROK_TAG:-0.3.0}
    network_mode: host
    command: ["mygrok-server", "-domain", "${DOMAIN}", "-control", "${MYGROK_CONTROL_ADDR:-:7000}", "-http", "${MYGROK_HTTP_ADDR:-127.0.0.1:8080}", "-port-base", "${MYGROK_PORT_BASE:-20000}", "-port-count", "${MYGROK_PORT_COUNT:-100}", "-log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    # 8080 binds to loopback by default (MYGROK_HTTP_ADDR): nginx is the only
    # public front. Admin/stats is on host loopback :7001.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mygrok-server
    restart: unless-stopped
