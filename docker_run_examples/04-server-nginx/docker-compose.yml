# Full mygrok server stack, self-contained: mygrok-server + nginx TLS front.
#
# Setup:
#   cp .env.example .env        # fill DOMAIN / MYGROK_TOKEN
#   mkdir -p certs              # drop fullchain.pem / privkey.pem (wildcard cert)
#   docker compose up -d
#
# The mygrok image is built by the `build:` block below (repo context: the
# repository root, two levels up). On an air-gapped host you can `docker load`
# a tarball from `make docker-save` and delete the `build:` block.

name: mygrok-example-04

services:
  mygrok-server:
    image: mygrok:${MYGROK_TAG:-0.3.0}
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${MYGROK_TAG:-0.3.0}
    command: ["mygrok-server", "-domain", "${DOMAIN}", "-control", "0.0.0.0:7000", "-http", "0.0.0.0:8080", "-log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    ports:
      - "7000:7000/tcp"
      - "20000-20099:20000-20099/tcp"
      - "20000-20099:20000-20099/udp"
    # 8080 is intentionally NOT published: nginx is the only front.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - mygrok-server
    restart: unless-stopped
