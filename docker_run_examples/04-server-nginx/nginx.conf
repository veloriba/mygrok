# mygrok server — nginx front-end (self-contained example 04).
#
# Replace example.com with your base domain (and the cert paths) — or mount
# a rendered conf. This compose stack mounts the file read-only and expects a
# wildcard certificate for *.example.com at:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# (bind-mounted from ./certs/).
#
# `http2 on;` requires nginx >= 1.25.1 (the nginx:alpine image ships it).
# On older nginx, remove the line and use `listen 443 ssl http2;` instead.

# WebSocket upgrade support (mygrok proxies WebSocket/HMR connections).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.example\.com$;

    return 301 https://$host$request_uri;
}

# HTTPS: wildcard tunnel front-end. Nginx passes the Host header through and
# the mygrok server (compose service name) dispatches to the right tunnel.
server {
    listen 443 ssl;
    http2 on;
    server_name ~^(?<subdomain>.+)\.example\.com$;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        # both services use network_mode: host; front on host loopback
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Required for SSE/LLM streaming: never buffer streamed responses.
        proxy_buffering off;
        # Long-lived streams (SSE, LLM token streams) must not be cut off.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
