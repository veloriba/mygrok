# Expose a local HTTP port through mygrok (client side).
#
# Setup:
#   cp .env.example .env   # fill MYGROK_SERVER / MYGROK_TOKEN
#   docker compose up -d
#
# The mygrok image must exist locally: build it once from the repo root
# (see ../README.md) or `docker load` a tarball from `make docker-save`.

name: mygrok-example-01

services:
  # Expose local HTTP on port 3000 as https://api.example.com
  # (your base domain).
  api:
    image: mygrok:${MYGROK_TAG:-0.4.0}
    command: ["mygrok", "http", "3000", "api", "--server", "${MYGROK_SERVER}", "--no-tui", "--log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    network_mode: host
    restart: unless-stopped
