# Several tunnels on one host (client side), showing the two wiring modes:
#
#   Mode 1 (web)    — network_mode: host: tunnel a port that lives on the
#                     Docker host itself (e.g. a local app on :8080).
#   Mode 2 (app-web) — shared docker network: the tunnel container talks to
#                     the app container by service name (--local-host app);
#                     no host port is involved at all.
#
# Setup:
#   cp .env.example .env   # fill MYGROK_SERVER / MYGROK_TOKEN
#   docker compose up -d
#
# The mygrok image must exist locally: build it once from the repo root
# (see ../README.md) or `docker load` a tarball from `make docker-save`.

name: mygrok-example-03

networks:
  appnet:
    driver: bridge

services:
  # Dummy app on the internal network — replace with any of your own
  # containers (must listen on the port the tunnel below targets).
  app:
    image: nginx:alpine
    networks: [appnet]
    restart: unless-stopped

  # Mode 1: host network — exposes a port on the Docker host (here :8080)
  # as https://web.example.com.
  web:
    image: mygrok:${MYGROK_TAG:-0.4.0}
    command: ["mygrok", "http", "8080", "web", "--server", "${MYGROK_SERVER}", "--no-tui", "--log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    network_mode: host
    restart: unless-stopped

  # Mode 2: shared docker network — exposes the `app` container's :80 as
  # https://app-web.example.com. The tunnel container dials app:80 directly
  # (container-to-container, no host port needed).
  app-web:
    image: mygrok:${MYGROK_TAG:-0.4.0}
    command: ["mygrok", "http", "80", "app-web", "--server", "${MYGROK_SERVER}", "--local-host", "app", "--no-tui", "--log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    networks: [appnet]
    depends_on:
      - app
    restart: unless-stopped
