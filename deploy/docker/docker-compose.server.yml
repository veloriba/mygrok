# mygrok server stack: tunnel server + nginx TLS front.
#
# Setup:
#   cp .env.server.example .env.server   # fill DOMAIN / MYGROK_TOKEN
#   mkdir -p certs                       # drop fullchain.pem / privkey.pem
#   docker compose --env-file .env.server -f docker-compose.server.yml up -d
#
# Day-to-day:
#   docker compose --env-file .env.server -f docker-compose.server.yml ps
#   docker compose --env-file .env.server -f docker-compose.server.yml logs -f mygrok-server
# (or `make docker-server-up|down|status|logs SERVICE=mygrok-server` from the repo root)
#
# Ports (bound directly on the host via network_mode: host — publishing 200
# ports through docker-proxy is slow and can destabilize small hosts):
#   ${MYGROK_CONTROL_ADDR:-:7000}  control, clients dial in
#   ${MYGROK_HTTP_ADDR:-127.0.0.1:8080}  HTTP front — loopback by default, nginx is the only public entry
#   ${MYGROK_PORT_BASE:-20000}+${MYGROK_PORT_COUNT:-100}  auto-assigned tcp/udp tunnel ports
# TLS: put a wildcard certificate for *.DOMAIN into ./certs/
# (fullchain.pem + privkey.pem) — see the "SSL & Nginx" section in README.md.
#
# The image is built on first `up` (or `make docker-build` in the repo root).
# It contains both binaries (mygrok client + mygrok-server); this stack runs
# the server one via the `command:` below.

name: mygrok-server

services:
  mygrok-server:
    image: mygrok:${MYGROK_TAG:-0.3.0}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VERSION: ${MYGROK_TAG:-0.3.0}
    network_mode: host
    command: ["mygrok-server", "-domain", "${DOMAIN}", "-control", "${MYGROK_CONTROL_ADDR:-:7000}", "-http", "${MYGROK_HTTP_ADDR:-127.0.0.1:8080}", "-port-base", "${MYGROK_PORT_BASE:-20000}", "-port-count", "${MYGROK_PORT_COUNT:-100}", "-log-format", "json"]
    environment:
      MYGROK_TOKEN: ${MYGROK_TOKEN}
    # The admin/stats listener is 127.0.0.1:7001 on the host itself
    # (loopback-only by default): `curl http://127.0.0.1:7001/stats` from the VPS.
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    # Host network too: the mygrok front binds the host loopback, which a
    # bridge-network container cannot reach. With both services on the host
    # network the whole chain is loopback-local and dockerd proxies are not
    # involved at all (bind 80/443 directly — stop any host nginx first).
    network_mode: host
    volumes:
      - ./nginx-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - mygrok-server
    restart: unless-stopped

  # Let's Encrypt wildcard certs: manual DNS-01 does not fit in a container
  # well. Either provision the cert on the host and mount ./certs (above),
  # or run certbot on the host:
  #   sudo certbot certonly --manual --preferred-challenges dns -d "*.DOMAIN"
  # then copy the resulting fullchain.pem / privkey.pem into ./certs/.
